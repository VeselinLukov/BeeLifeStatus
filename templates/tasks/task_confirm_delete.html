<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete Inspection</title>
</head>
<body>
    <div>
        <h1>Delete Task</h1>
        <p>Are you sure you want to delete the task with deadline
            {{ task.deadline|date:"d M Y" }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirm Delete</button>
            <a href="{% url 'tasks:tasks-list' %}">Cancel</a>
        </form>
    </div>

</body>
</html>
